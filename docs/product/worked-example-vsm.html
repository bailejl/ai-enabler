<style>
:root{--fg:#1f2328;--muted:#5b6370;--line:#8a929c;--grid:#d9dde2;--bg:#ffffff;--panel:#f6f7f9;--auto:#e9ecef;--accent:#2563eb;--accentbg:rgba(37,99,235,.10);--ai:#c2410c;--warn:#d97706;--crit:#dc2626;--critbg:rgba(220,38,38,.12);--band:#eef2f7}
@media (prefers-color-scheme: dark){:root{--fg:#e6e8eb;--muted:#a3abb5;--line:#7d8590;--grid:#3a4048;--bg:#16181c;--panel:#1f2329;--auto:#2a2f36;--accent:#60a5fa;--accentbg:rgba(96,165,250,.15);--ai:#fb923c;--warn:#fbbf24;--crit:#f87171;--critbg:rgba(248,113,113,.18);--band:#232a33}}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:14px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--grid)}
header h1{font-size:16px;margin:0;font-weight:700}
header p{margin:0;color:var(--muted);font-size:13px}
.ctrl{margin-left:auto;display:flex;gap:6px}
button{font:inherit;font-size:13px;padding:6px 12px;border-radius:6px;border:1px solid var(--grid);background:var(--panel);color:var(--fg);cursor:pointer}
button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.wrap{overflow:auto;height:calc(100vh - 62px)}
.wrap svg{display:block}
.fit svg{width:100%;height:auto}
svg text{fill:var(--fg);font-family:inherit;font-size:12px}
svg .sub,svg .q,svg .lbl{fill:var(--muted)}
svg .crit{fill:var(--crit)}
svg .bl{fill:var(--fg)}
svg .mk{fill:var(--fg)}
.box{fill:var(--bg);stroke:var(--line);stroke-width:1.5}
.box.ai{stroke:var(--ai);stroke-width:2.5}
.box.warn{stroke:var(--warn);stroke-width:2.5;stroke-dasharray:7 4}
.box.auto{fill:var(--auto)}
.box.con{fill:var(--critbg);stroke:var(--crit);stroke-width:3}
.data{fill:var(--panel);stroke:var(--line);stroke-width:1}
.grid{stroke:var(--grid);stroke-width:1}
.band{fill:var(--band);stroke:none}
.bandt{fill:var(--fg)}
.sys{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.ln{stroke:var(--line);stroke-width:1.5;fill:none}
.info{stroke:var(--line);stroke-width:1.4;stroke-dasharray:3 4;fill:none}
.manual{stroke:var(--line);stroke-width:1.4;fill:none}
.push{stroke:var(--line);stroke-width:7;stroke-dasharray:6 4;fill:none}
.fillc{fill:var(--line)}
.fillcrit{fill:var(--crit)}
.tri{fill:none;stroke:var(--fg);stroke-width:1.5}
.rework{stroke:var(--line);stroke-width:1.5;stroke-dasharray:7 5;fill:none}
.bypass{stroke:var(--crit);stroke-width:2;stroke-dasharray:8 5;fill:none}
.burst{fill:#991b1b;stroke:#7f1d1d;stroke-width:1.5}
.burst-t{fill:#ffffff !important}
.gatei{fill:none;stroke:var(--fg);stroke-width:1.5}
.marker{fill:var(--fg)}
.lad{stroke:var(--fg);stroke-width:1.5;fill:none}
.sum{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.panel{fill:var(--panel);stroke:var(--grid);stroke-width:1}
</style></head>
